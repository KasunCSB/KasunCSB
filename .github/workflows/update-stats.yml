name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run once a day
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Fetch Stats
        run: |
          mkdir -p .github
          BASE="https://github-stats-extended.vercel.app"
          curl -fsSL -o .github/github-stats.svg \
            "$BASE/api?username=KasunCSB&show_icons=true&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=00ffc8&icon_color=00ffc8&text_color=8B949E"
          curl -fsSL -o .github/top-langs.svg \
            "$BASE/api/top-langs/?username=KasunCSB&layout=compact&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=00ffc8&text_color=8B949E"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub stats [skip ci]"
          file_pattern: .github/*.svg
